id = "lane"
name = "Lane"
version = "0.3.0"
min_herdr_version = "0.9.0"
description = "Create, open, merge, push and remove lukeed/lane worktrees as linked herdr workspaces from one popup menu, and turn herdr's own new worktrees into lanes."
platforms = ["linux", "macos"]

[[build]]
command = ["cargo", "build", "--release", "--locked"]

[[actions]]
id = "menu"
title = "Lane: open the lane menu"
contexts = ["workspace"]
command = ["bash", "bin/lane-action"]

[[panes]]
id = "menu"
title = "Lane"
placement = "popup"
width = "70%"
height = "60%"
command = ["bash", "-c", "exec \"$HERDR_PLUGIN_ROOT/target/release/lane-menu\""]

[[events]]
on = "worktree.created"
command = ["bash", "bin/lane-adopt"]
