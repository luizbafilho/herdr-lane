id = "lane"
name = "Lane"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Create, open, merge, push and remove lukeed/lane worktrees as linked herdr workspaces from one popup menu."
platforms = ["linux", "macos"]

[[actions]]
id = "menu"
title = "Lane: open the lane menu"
contexts = ["workspace"]
command = ["bash", "bin/lane-action"]

[[panes]]
id = "menu"
title = "Lane"
placement = "popup"
width = "70%"
height = "60%"
command = ["bash", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/lane-menu\""]
