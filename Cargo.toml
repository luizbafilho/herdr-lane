[package]
name = "lane-menu"
version = "0.3.0"
edition = "2024"
description = "Popup menu for lane worktrees in herdr"
license = "MIT"
publish = false

[dependencies]
ratatui = { version = "0.30.2", default-features = false, features = ["layout-cache", "std"] }
ratcn = { version = "0.0.6", features = ["termina"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"
